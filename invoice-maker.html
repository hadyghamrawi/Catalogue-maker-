<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Maker — CHINA Direct Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e8392b; --red-soft:#f15a4d; --ink:#1c1c1c; --ink-soft:#6b6b6b;
    --line:#e5e5e5; --head:#2b2b2b; --bg:#d9d9d9; --paper:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Poppins",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}

  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:40;background:#1c1c1c;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar h1{font-size:16px;font-weight:600;flex:1;min-width:140px}
  .tbtn{font:inherit;font-weight:600;font-size:14px;border:none;border-radius:999px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .tbtn-red{background:var(--red);color:#fff} .tbtn-red:hover{background:var(--red-soft)}
  .tbtn-ghost{background:#333;color:#fff} .tbtn-ghost:hover{background:#444}
  .tbtn svg{width:16px;height:16px}

  .wrap{max-width:820px;margin:18px auto;padding:0 14px}

  /* the invoice sheet */
  .sheet{background:var(--paper);position:relative;overflow:hidden;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
  .sheet .corner-tr{position:absolute;top:0;right:0;width:46%;height:120px;pointer-events:none}
  .sheet .corner-bl{position:absolute;bottom:0;left:0;width:34%;height:60px;pointer-events:none;z-index:1}
  .pad{padding:34px 34px 64px}

  .toprow{display:flex;align-items:flex-start;gap:16px;position:relative;z-index:2}
  .logo-box{display:flex;align-items:center;gap:2px}
  .logo-box img{height:92px;width:auto;object-fit:contain}

  .meta{display:flex;justify-content:space-between;gap:20px;margin-top:30px}
  .meta .lbl{font-weight:700;font-size:15px;margin-bottom:3px}
  .field-inp{font:inherit;border:none;outline:none;background:transparent;color:var(--ink);font-size:14px;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
  .field-inp:hover,.field-inp:focus{border-bottom-color:var(--line)}
  .meta .right{text-align:right;white-space:nowrap}
  .meta .right .field-inp{text-align:right}

  /* table */
  table{width:100%;border-collapse:collapse;margin-top:26px;border-radius:8px;overflow:hidden}
  thead th{background:var(--head);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.3px;padding:13px 10px;text-align:center}
  thead th:first-child{text-align:left;padding-left:16px}
  thead th.amt{text-align:right;padding-right:16px}
  tbody td{padding:10px;text-align:center;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;background:#fff}
  tbody td.amt{text-align:right;padding-right:16px;font-weight:600}
  tbody td:first-child{padding-left:16px}
  .imgcell{width:84px}
  .thumb{width:62px;height:78px;border:1px solid var(--line);border-radius:4px;object-fit:cover;background:#f3f3f3;display:block;margin:0 auto;cursor:pointer}
  .thumb-empty{width:62px;height:78px;border:1.5px dashed #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#bbb;cursor:pointer;margin:0 auto;font-size:10px;text-align:center;padding:4px}
  .cellinp{font:inherit;border:none;outline:none;background:transparent;text-align:center;width:100%;font-size:14px}
  .cellinp.amt{text-align:right;font-weight:600}
  .delrow{border:none;background:transparent;color:#ccc;cursor:pointer;font-size:18px;line-height:1}
  .delrow:hover{color:var(--red)}
  tfoot td{background:#ededed;height:30px}
  .addrow{margin-top:10px;border:1.5px dashed #ccc;background:transparent;color:var(--ink-soft);border-radius:8px;padding:10px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
  .addrow:hover{border-color:var(--red);color:var(--red)}
  .addrow svg{width:15px;height:15px}

  /* shipping + totals */
  .lower{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap}
  .ship{flex:1;min-width:240px}
  .ship .lbl{font-weight:700;font-size:13.5px;letter-spacing:.3px;margin-bottom:6px}
  .ship textarea{width:100%;font:inherit;font-size:14px;color:var(--red);border:none;outline:none;background:transparent;resize:vertical;min-height:90px;line-height:1.5}
  .totals{width:260px;max-width:100%}
  .totals .trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
  .totals .trow .k{font-weight:700;font-size:13.5px;letter-spacing:.3px}
  .totals .trow .v{font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px}
  .totals .trow .v input{font:inherit;border:none;outline:none;background:transparent;text-align:right;width:80px;font-weight:600;border-bottom:1px dashed transparent}
  .totals .trow .v input:hover,.totals .trow .v input:focus{border-bottom-color:var(--line)}
  .totals .due{color:var(--red)} .totals .due input{color:var(--red)}

  /* footer */
  .foot{margin-top:46px;position:relative;z-index:2}
  .sigline{width:230px;border-top:1px solid #999;padding-top:6px}
  .sig-name{font-weight:700;font-size:15px}
  .sig-loc{font-style:italic;font-size:12.5px;color:var(--ink-soft)}
  .foot-contact{position:absolute;right:0;bottom:0;text-align:right}
  .foot-contact .ph{color:var(--red);font-weight:700;font-size:17px}
  .foot-contact .reg{font-size:12.5px;color:var(--ink-soft)}

  @media print{
    .toolbar,.addrow,.delrow,.no-print{display:none!important}
    body{background:#fff} .wrap{margin:0;padding:0;max-width:none}
    .sheet{box-shadow:none;border-radius:0}
    .field-inp,.cellinp,.totals input,.ship textarea{border-bottom-color:transparent!important}
    .thumb-empty{display:none}
  }
  @media (max-width:560px){
    .pad{padding:22px 18px 54px} .logo-box img{height:74px}
    thead th{font-size:10.5px;padding:9px 5px} tbody td{font-size:12.5px;padding:7px 5px}
    .thumb,.thumb-empty{width:46px;height:58px} .imgcell{width:56px}
    .cellinp{font-size:12.5px}
  }
</style>
</head>

  <button class="tbtn tbtn-red" id="pdfBtn">

      </div>

      <div class="meta">
        <div class="left">
          <div class="lbl">Customer</div>
          <input class="field-inp" id="custName" placeholder="Customer name" value="">
          <input class="field-inp" id="custPhone" placeholder="+961 ..." value="">
        </div>
        <div class="right">
          <div style="height:21px"></div>
          <span style="font-size:14px">Date: </span><input class="field-inp" id="invDate" style="width:140px;display:inline-block" placeholder="22 May 2026">
        </div>
      </div>

      <table>
        <thead>
          <tr><th>ITEM IMAGE</th><th>SIZE</th><th>QTY</th><th>PRICE</th><th class="amt">AMOUNT</th></tr>
        </thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td colspan="5"></td></tr></tfoot>
      </table>
      <button class="addrow no-print" id="addRowBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Add item</button>

      <div class="lower">
        <div class="ship">
          <div class="lbl">SHIPPING INFORMATION</div>
          <textarea id="shipInfo">Shipping cost is estimated at $13.5–15/kg. Final shipping charges will be confirmed upon arrival of the shipment to Lebanon, based on actual weight and dimensions. Official shipping invoice will be provided.</textarea>
        </div>
        <div class="totals">
          <div class="trow"><span class="k">TOTAL AMOUNT</span><span class="v" id="totalAmt">0$</span></div>
          <div class="trow"><span class="k">AMOUNT PAID</span><span class="v"><input id="paid" inputmode="decimal" value="0">$</span></div>
          <div class="trow due"><span class="k">BALANCE DUE:</span><span class="v" id="balanceDue">0$</span></div>
        </div>
      </div>

      <div class="foot">
        <div class="sigline">
          <div class="sig-name">Chinadirectway</div>
          <div class="sig-loc">Tripoli, Lebanon</div>
        </div>
        <div class="foot-contact">
          <div class="ph">+96181386889</div>
          <div class="reg">Lebanon, China, Turkey</div>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="rowFile" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s);
let rows=[];           // {id, img, size, qty, price}
let activeRowId=null;
const uid=()=>"r"+Date.now()+Math.random().toString(36).slice(2,5);

function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function money(n){const r=Math.round(n*100)/100;return (r%1===0?r:r.toFixed(2))+"$";}

function addRow(data){rows.push(Object.assign({id:uid(),img:"",size:"",qty:"1",price:""},data||{}));render();}

function render(){
  $("#rows").innerHTML=rows.map(r=>{
    const amt=num(r.qty)*num(r.price);
    return `<tr data-id="${r.id}">
      <td class="imgcell">${r.img
        ? `<img src="${r.img}" class="thumb" data-img="${r.id}">`
        : `<div class="thumb-empty no-print" data-img="${r.id}">+ photo</div>`}</td>
      <td><input class="cellinp" data-f="size" data-id="${r.id}" value="${(r.size||'').replace(/"/g,'&quot;')}" placeholder="—"></td>
      <td><input class="cellinp" data-f="qty" data-id="${r.id}" value="${r.qty||''}" inputmode="numeric" style="max-width:50px"></td>
      <td><input class="cellinp" data-f="price" data-id="${r.id}" value="${r.price||''}" inputmode="decimal" placeholder="0" style="max-width:70px"></td>
      <td class="amt">${money(amt)} <button class="delrow no-print" data-del="${r.id}">×</button></td>
    </tr>`;
  }).join("");

  // totals
  const total=rows.reduce((s,r)=>s+num(r.qty)*num(r.price),0);
  $("#totalAmt").textContent=money(total);
  const paid=num($("#paid").value);
  $("#balanceDue").textContent=money(total-paid);

  // wire
  $("#rows").querySelectorAll("[data-f]").forEach(inp=>{
    inp.oninput=()=>{const r=rows.find(x=>x.id===inp.dataset.id);if(r){r[inp.dataset.f]=inp.value;
      // live update amount + totals without full re-render (keep focus)
      const tr=inp.closest("tr");const amtCell=tr.querySelector(".amt");
      amtCell.childNodes[0].nodeValue=money(num(r.qty)*num(r.price))+" ";
      const total=rows.reduce((s,x)=>s+num(x.qty)*num(x.price),0);
      $("#totalAmt").textContent=money(total);
      $("#balanceDue").textContent=money(total-num($("#paid").value));
    }};
  });
  $("#rows").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{rows=rows.filter(x=>x.id!==b.dataset.del);render();});
  $("#rows").querySelectorAll("[data-img]").forEach(el=>el.onclick=()=>{activeRowId=el.dataset.img;$("#rowFile").click();});
}

function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();
  img.onload=()=>{const max=500;let{width:w,height:h}=img;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",0.75));};
  img.onerror=()=>res("");img.src=e.target.result;};r.readAsDataURL(file);});}

$("#rowFile").onchange=async e=>{const f=e.target.files[0];if(!f||!activeRowId)return;
  const data=await compress(f);const r=rows.find(x=>x.id===activeRowId);if(r){r.img=data;render();}e.target.value="";};
$("#addRowBtn").onclick=()=>addRow();
$("#paid").oninput=()=>{const total=rows.reduce((s,r)=>s+num(r.qty)*num(r.price),0);$("#balanceDue").textContent=money(total-num($("#paid").value));};
$("#pdfBtn").onclick=()=>window.print();
$("#resetBtn").onclick=()=>{if(!confirm("Start a new blank invoice?"))return;
  rows=[];$("#custName").value="";$("#custPhone").value="";$("#invDate").value="";$("#paid").value="0";
  addRow();addRow();addRow();};

// init with date + 3 empty rows
(function(){
  const d=new Date();const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  $("#invDate").value=d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
  addRow();addRow();addRow();
})();
</script>
</body>
</html>
